<!--
  PEGAR esto dentro del formulario de alta de despachante (pestaña Clientes),
  justo debajo del campo cli_cuit. Asume que ya existen los inputs cli_nombre,
  cli_tipo, cli_factura, cli_tiene_factura, cli_cuit y el botón que llama a
  guardarCliente().
-->

<div class="form-group">
  <label>Moneda de tarifa</label>
  <select id="cli_moneda" onchange="togglePesosClienteForm()">
    <option value="usd">USD (tarifa general + TC)</option>
    <option value="pesos">Pesos fijo (propia de este despachante)</option>
  </select>
</div>

<div id="cli-pesos-wrap" style="display:none;grid-column:1/-1;background:#f8fafc;border-radius:10px;padding:14px;margin-top:8px;">
  <div style="font-size:12px;font-weight:700;color:#1e3a8a;margin-bottom:10px;">
    Tarifas fijas en $ para este despachante (no dependen del TC del día)
  </div>
  <div class="op-grid">
    <div class="field"><label>Canal V ($)</label><input type="number" id="cli_pesos_v" value="0"></div>
    <div class="field"><label>Canal N ($)</label><input type="number" id="cli_pesos_n" value="0"></div>
    <div class="field"><label>Canal R ($)</label><input type="number" id="cli_pesos_r" value="0"></div>
    <div class="field"><label>Armado sobre ($)</label><input type="number" id="cli_pesos_sobre" value="0"></div>
    <div class="field"><label>Camión AD, canal V/N ($)</label><input type="number" id="cli_pesos_cam_v" value="0"></div>
    <div class="field"><label>Camión AD, canal R ($)</label><input type="number" id="cli_pesos_cam_r" value="0"></div>
    <div class="field"><label>SENASA embalaje ($)</label><input type="number" id="cli_pesos_senasa_p" value="0"></div>
    <div class="field"><label>SENASA producto ($)</label><input type="number" id="cli_pesos_senasa_prod" value="0"></div>
    <div class="field"><label>Hoja adicional ($)</label><input type="number" id="cli_pesos_hoja" value="0"></div>
    <div class="field"><label>Fin de semana ($)</label><input type="number" id="cli_pesos_finsem" value="0"></div>
  </div>
</div>
